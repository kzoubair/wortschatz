<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wortschatz Klinik</title>
  <meta name="description" content="Vocabulaire allemand B1–C1 pour médecins : répétition espacée, combos et collection, 100 % hors ligne.">

  <!-- PWA : manifest, couleurs, icônes (chemins relatifs uniquement) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0E1116">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wortschatz">

  <!-- Thème appliqué avant l'affichage (évite un flash de la mauvaise couleur) -->
  <script>
    (function () {
      var pref = 'dark';
      try { pref = (JSON.parse(localStorage.getItem('wortschatz-progression')) || {}).settings.appearance || 'dark'; } catch (e) {}
      var mode = pref === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref;
      document.documentElement.setAttribute('data-theme', mode);
    })();
  </script>

  <!-- Polices servies en local -->
  <link rel="preload" href="./fonts/space-grotesk-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="pulse-layer" aria-hidden="true"></div>

  <main id="app">

    <!-- ================= ACCUEIL ================= -->
    <section id="home" class="screen" aria-labelledby="home-title">
      <header class="topbar">
        <h1 id="home-title" class="brand">Wortschatz<span>Klinik</span></h1>
        <div class="topbar-actions">
          <button class="icon-btn" id="btn-sound"></button>
          <button class="icon-btn" id="btn-settings" data-i18n-aria="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          </button>
        </div>
      </header>

      <div class="level-strip">
        <span class="level-badge" id="home-level"></span>
        <div class="xpbar" aria-hidden="true"><i id="home-xpfill"></i></div>
        <span class="xp-text num" id="home-xp"></span>
      </div>
      <p class="small muted rank-next" id="rank-next"></p>

      <div class="hero">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-track" cx="60" cy="60" r="52"/>
            <circle class="ring-fill" id="goal-ring" cx="60" cy="60" r="52"/>
          </svg>
          <div class="ring-center">
            <strong class="num" id="goal-count">0</strong>
            <span class="num" id="goal-total">/ 40</span>
          </div>
        </div>
        <div class="hero-info">
          <p class="eyebrow" data-i18n="goalToday"></p>
          <ul class="due-list">
            <li><b class="num" id="due-review">0</b> <span data-i18n="toReview"></span></li>
            <li><b class="num" id="due-new">0</b> <span data-i18n="newCards"></span></li>
            <li><b class="num" id="due-learning">0</b> <span data-i18n="inProgress"></span></li>
          </ul>
        </div>
      </div>

      <div class="cta-row">
        <button class="btn btn-primary" id="btn-start"><span data-i18n="review"></span><kbd data-i18n="enterKey"></kbd></button>
        <button class="btn btn-ghost" id="btn-sprint"><span data-i18n="sprint"></span><small class="num" id="sprint-best"></small></button>
      </div>
      <p class="hint" id="home-hint" hidden></p>

      <section class="panel" aria-labelledby="streak-title">
        <div class="panel-head">
          <h2 id="streak-title" data-i18n="streak"></h2>
          <p class="streak-num"><b class="num" id="streak-days">0</b> <span id="streak-label"></span></p>
        </div>
        <div class="calendar" id="calendar"></div>
        <p class="small muted" id="streak-note"></p>
      </section>

      <section class="panel" aria-labelledby="collection-title">
        <div class="panel-head">
          <h2 id="collection-title" data-i18n="collection"></h2>
          <p class="small"><b class="num" id="coll-mastered">0</b> <span class="muted">/ <span class="num" id="coll-total">0</span> <span data-i18n="mastered"></span></span></p>
        </div>
        <div class="legend small muted" aria-hidden="true">
          <span><i class="t0"></i><span data-i18n="tierNew"></span></span><span><i class="t1"></i><span data-i18n="tierLearn"></span></span><span><i class="t2"></i><span data-i18n="tierYoung"></span></span><span><i class="t3"></i><span data-i18n="tierSolid"></span></span><span><i class="t4"></i><span data-i18n="tierMastered"></span></span>
        </div>
        <div id="collection"></div>
      </section>
      <p class="footer-note small muted" id="offline-status"></p>
    </section>

    <!-- ================= SESSION ================= -->
    <section id="session" class="screen" hidden>
      <header class="session-top">
        <button class="icon-btn" id="btn-quit" data-i18n-aria="endSession">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="session-progress" aria-hidden="true"><i id="session-bar"></i></div>
        <span class="session-xp num" id="session-count">0 / 20</span>
      </header>

      <div class="combo" id="combo" aria-live="polite">
        <span class="combo-num num" id="combo-num">0</span>
        <span class="combo-label" data-i18n="combo"></span>
      </div>

      <div class="stage" id="stage">
        <div class="card" id="card">
          <div class="card-glow" aria-hidden="true"></div>
          <div class="card-inner">
            <div class="face front">
              <div class="badges"><span class="badge" id="card-level">B1</span><span class="badge" id="card-theme"></span><span class="badge badge-mode" id="card-mode"></span></div>
              <p class="prompt" id="card-fr" lang="fr">…</p>
              <p class="nature small muted" id="card-nature"></p>
              <p class="typing-hint num" id="card-hint" aria-hidden="true"></p>
              <p class="tap-hint small" id="card-tap" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V6.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V12m0-1a1.5 1.5 0 0 1 3 0v3.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.9-2.6L4.2 15a1.6 1.6 0 0 1 2.6-1.9L9 15.5"/></svg>
                <span data-i18n="tapToFlip"></span>
              </p>
            </div>
            <div class="face back">
              <div class="badges"><span class="badge" id="back-level">B1</span><span class="badge" id="back-theme"></span></div>
              <p class="target" id="card-de" lang="de">…</p>
              <p class="grammar small" id="card-grammar"></p>
              <ol class="examples" id="card-examples" lang="de"></ol>
            </div>
          </div>
        </div>
        <div class="particles" id="particles" aria-hidden="true"></div>
      </div>

      <div class="controls" id="controls">
        <!-- QCM (mode « QCM et saisie ») -->
        <div class="choices" id="choices" role="group" data-i18n-aria="choicesAria"></div>
        <!-- Réponse écrite (mode « QCM et saisie ») -->
        <form class="write" id="write" autocomplete="off" hidden>
          <div class="special-keys" id="special-keys"></div>
          <div class="write-row">
            <input id="answer" type="text" lang="de" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-aria="answerAria">
            <button class="btn btn-primary btn-validate" type="submit" data-i18n="validate"></button>
          </div>
          <p class="small muted write-help" id="write-help"></p>
        </form>
        <!-- Verdict + notation -->
        <div class="verdict" id="verdict" hidden aria-live="polite"></div>
        <div class="ratings" id="ratings" hidden>
          <button class="rate rate-1" data-r="1"><b data-i18n="rate1"></b><small class="num"></small><kbd>1</kbd></button>
          <button class="rate rate-2" data-r="2"><b data-i18n="rate2"></b><small class="num"></small><kbd>2</kbd></button>
          <button class="rate rate-3" data-r="3"><b data-i18n="rate3"></b><small class="num"></small><kbd>3</kbd></button>
          <button class="rate rate-4" data-r="4"><b data-i18n="rate4"></b><small class="num"></small><kbd>4</kbd></button>
        </div>
        <button class="btn btn-ghost reveal-btn" id="btn-reveal"><span data-i18n="dontKnow"></span> <kbd data-i18n="spaceKey"></kbd></button>
      </div>
    </section>

    <!-- ================= FIN DE SESSION ================= -->
    <section id="summary" class="screen" hidden aria-labelledby="summary-title">
      <div class="summary">
        <p class="eyebrow" data-i18n="sessionDone"></p>
        <h2 id="summary-title" class="summary-title"></h2>
        <div class="stat-grid">
          <div class="stat"><b class="num" data-count="seen">0</b><span data-i18n="cardsSeen"></span></div>
          <div class="stat"><b class="num" data-count="rate" data-suffix=" %">0</b><span data-i18n="successRate"></span></div>
          <div class="stat stat-amber"><b class="num" data-count="anchored" data-prefix="+">0</b><span data-i18n="anchoredToday"></span></div>
          <div class="stat stat-amber"><b class="num" data-count="combo">0</b><span data-i18n="longestCombo"></span></div>
        </div>
        <ul class="sum-progress" id="sum-progress"></ul>
        <div class="acquired">
          <p class="eyebrow"><span class="num" id="acquired-count">0</span> <span data-i18n="acquired"></span></p>
          <div class="chips" id="acquired"></div>
        </div>
        <p class="small muted" id="summary-note"></p>
        <div class="cta-row">
          <button class="btn btn-primary" id="btn-again"><span data-i18n="continue"></span><kbd data-i18n="enterKey"></kbd></button>
          <button class="btn btn-ghost" id="btn-home" data-i18n="home"></button>
        </div>
      </div>
    </section>

    <!-- ================= SPRINT ================= -->
    <section id="sprint" class="screen" hidden>
      <header class="session-top">
        <button class="icon-btn" id="btn-sprint-quit" data-i18n-aria="stopSprint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="timer" aria-hidden="true"><i id="sprint-timer"></i></div>
        <span class="sprint-clock num" id="sprint-clock">60</span>
      </header>
      <div class="combo" id="sprint-combo">
        <span class="combo-num num" id="sprint-score">0</span>
        <span class="combo-label" data-i18n="score"></span>
      </div>
      <div class="stage">
        <div class="card sprint-card" id="sprint-card">
          <div class="card-glow" aria-hidden="true"></div>
          <div class="card-inner">
            <div class="face front">
              <div class="badges"><span class="badge" id="sprint-level">B1</span><span class="badge" id="sprint-theme"></span></div>
              <p class="prompt" id="sprint-fr" lang="fr">…</p>
              <p class="nature small muted" id="sprint-nature"></p>
            </div>
          </div>
        </div>
        <div class="particles" id="sprint-particles" aria-hidden="true"></div>
      </div>
      <div class="controls">
        <div class="choices" id="sprint-choices" role="group" data-i18n-aria="choicesAria"></div>
        <p class="small muted center" data-i18n="sprintNote"></p>
      </div>
      <div class="sprint-end" id="sprint-end" hidden>
        <div class="summary">
          <p class="eyebrow" data-i18n="sprintDone"></p>
          <h2 class="summary-title" id="sprint-end-title"></h2>
          <div class="stat-grid">
            <div class="stat stat-amber"><b class="num" data-count="score">0</b><span data-i18n="score"></span></div>
            <div class="stat"><b class="num" data-count="best">0</b><span data-i18n="best"></span></div>
            <div class="stat"><b class="num" data-count="accuracy" data-suffix=" %">0</b><span data-i18n="accuracy"></span></div>
            <div class="stat stat-amber"><b class="num" data-count="combo">0</b><span data-i18n="longestCombo"></span></div>
          </div>
          <div class="cta-row">
            <button class="btn btn-primary" id="btn-sprint-again"><span data-i18n="replay"></span><kbd data-i18n="enterKey"></kbd></button>
            <button class="btn btn-ghost" id="btn-sprint-home" data-i18n="home"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= PARAMÈTRES ================= -->
    <section id="settings" class="screen" hidden aria-labelledby="settings-title">
      <header class="topbar">
        <button class="icon-btn" id="btn-settings-back" data-i18n-aria="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2 id="settings-title" class="brand small-brand" data-i18n="settings"></h2>
        <span></span>
      </header>

      <div class="panel">
        <h3 data-i18n="display"></h3>
        <p class="field-label small" data-i18n="uiLang"></p>
        <div class="toggle-chips" id="set-lang">
          <button data-v="fr">Français</button><button data-v="de">Deutsch</button>
        </div>
        <p class="field-label small" data-i18n="appearance"></p>
        <div class="toggle-chips" id="set-appearance">
          <button data-v="system" data-i18n="apSystem"></button><button data-v="dark" data-i18n="apDark"></button><button data-v="light" data-i18n="apLight"></button>
        </div>
      </div>

      <div class="panel">
        <h3 data-i18n="revision"></h3>
        <p class="field-label small" data-i18n="answerMode"></p>
        <div class="toggle-chips" id="set-mode">
          <button data-v="flip" data-i18n="modeFlipSet"></button><button data-v="engine" data-i18n="modeEngineSet"></button>
        </div>
        <p class="small muted" id="mode-help"></p>
        <label class="switch"><input type="checkbox" id="set-shuffle"><span data-i18n="shuffle"></span></label>
        <p class="small muted" data-i18n="shuffleHelp"></p>
      </div>

      <div class="panel">
        <h3 data-i18n="levelsActive"></h3>
        <div class="toggle-chips" id="set-levels"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3 data-i18n="themesActive"></h3>
          <div class="mini-actions"><button class="link" id="themes-all" data-i18n="all"></button><button class="link" id="themes-med" data-i18n="medShort"></button><button class="link" id="themes-none" data-i18n="none"></button></div>
        </div>
        <div class="theme-list" id="set-themes"></div>
      </div>

      <div class="panel settings-grid">
        <label class="field"><span><span data-i18n="goalSetting"></span> <small class="muted" data-i18n="cardsUnit"></small></span><input type="number" id="set-goal" min="5" max="500" step="5"></label>
        <label class="field"><span><span data-i18n="sessionLen"></span> <small class="muted" data-i18n="cardsUnit"></small></span><input type="number" id="set-session" min="5" max="200" step="5"></label>
        <label class="field"><span data-i18n="newPerDay"></span><input type="number" id="set-new" min="0" max="500" step="5"></label>
        <label class="field"><span data-i18n="reviewsPerDay"></span><input type="number" id="set-reviews" min="0" max="5000" step="10"></label>
      </div>

      <div class="panel">
        <label class="switch"><input type="checkbox" id="set-article"><span data-i18n="requireArticle"></span></label>
        <label class="switch"><input type="checkbox" id="set-sound"><span data-i18n="sounds"></span></label>
        <label class="switch"><input type="checkbox" id="set-motion"><span data-i18n="reduceMotion"></span></label>
      </div>

      <div class="panel" id="leech-panel">
        <h3 data-i18n="leeches"></h3>
        <p class="small muted" data-i18n="leechHelp"></p>
        <ul class="leech-list" id="leech-list"></ul>
      </div>

      <div class="panel">
        <h3 data-i18n="backup"></h3>
        <p class="small muted" data-i18n="backupHelp"></p>
        <div class="cta-row">
          <button class="btn btn-ghost" id="btn-export" data-i18n="export"></button>
          <label class="btn btn-ghost file-btn"><span data-i18n="import"></span><input type="file" id="file-import" accept="application/json,.json"></label>
        </div>
      </div>

      <div class="panel danger">
        <h3 data-i18n="resetTitle"></h3>
        <button class="btn btn-danger-ghost" id="btn-reset" data-i18n="resetBtn"></button>
        <div class="reset-confirm" id="reset-confirm" hidden>
          <p class="small" data-i18n-html="resetHelp"></p>
          <div class="write-row">
            <input type="text" id="reset-input" autocomplete="off">
            <button class="btn btn-danger" id="btn-reset-confirm" disabled data-i18n="erase"></button>
          </div>
        </div>
      </div>
      <p class="footer-note small muted" id="about"></p>
    </section>
  </main>

  <!-- Passage de niveau (plein écran) -->
  <div class="levelup" id="levelup" hidden aria-live="assertive">
    <p class="eyebrow" data-i18n="rankUp"></p>
    <p class="levelup-num levelup-rank" id="levelup-num"></p>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="./vocabulaire.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/srs.js"></script>
  <script src="./js/answer.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/sound.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
